<ng-template #loading>
    <div class="alert alert-info text-center">
    espere por favor
  </div>  
</ng-template>

<div *ngIf="country; else loading">
  <div class="row">
    <div class="col-12">
      <h2> Pais: <strong> {{country.name.common}}</strong></h2>
    </div>
  <div class="row">
     <div class="col-4">
        <h3>Bandera</h3>
        <img [src]="country.flags.svg" [alt]="country.name.common" class="img-thumbnail">
       <p><strong>Capital: {{country.capital}}</strong></p>

        <div class="col">
          <ul class=" list-group">
            <li class="list-group-item">
               <strong>Poblacion</strong><span> {{country.population}}</span>
              </li>
             <li class="list-group-item">
              <strong>Codigo: {{country.cca2}}</strong>

            </li>
            
          </ul>
        </div>
  

      
     </div>
  </div>
</div>
